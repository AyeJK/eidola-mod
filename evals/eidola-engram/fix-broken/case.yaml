schema_version: "1.1"
name: eidola-fix-broken
description: Fix a broken Engram (wrong scene, no Eidola dependency, an ID that disagrees, an import from outside, a prompt hook). It must pass the checker and draw.
tags: [eidola-engram, fix]
plugins: ["../../.."]
runs: 1
expected_outcome: broken-moth fixed in place in eidola-home/engrams/broken-moth; checker ok and draws; the prompt.submit hook gone, nothing added to the prompt.
execution:
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  env:
    EVAL_EIDOLA_HOME: eidola-home
  prompt: |
    My Engram broken-moth (it's in my Engram home) won't load in Eidola. Can you fix it so it passes the checker and draws? Keep the moth as it is otherwise.
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: eidola-engram
  - name: checker-ok
    type: regex
    target: trace
    pattern: 'broken-moth: ok'
  - name: draws
    type: regex
    target: trace
    pattern: 'broken-moth: draws'
  - name: scene-self
    type: regex
    target: { source: file, path: eidola-home/engrams/broken-moth/engram.json }
    pattern: '"scene": "self"'
  - name: depends-on-eidola
    type: regex
    target: { source: file, path: eidola-home/engrams/broken-moth/.claude-plugin/plugin.json }
    pattern: '"dependencies"[\s\S]*"eidola"'
  - name: id-agrees
    type: regex
    target: { source: file, path: eidola-home/engrams/broken-moth/hooks/register.tsx }
    pattern: "const ID = 'broken-moth'"
  - name: no-prompt-hook
    type: regex
    target: { source: file, path: eidola-home/engrams/broken-moth/hooks/register.tsx }
    pattern: 'prompt[.]submit'
    match: not_contains
  - name: nothing-written-in-eidola
    type: tool_used
    tool: Write
    input_match: 'eidola-mod'
    min: 0
    max: 0
  - name: nothing-edited-in-eidola
    type: tool_used
    tool: Edit
    input_match: 'eidola-mod'
    min: 0
    max: 0
  - name: nothing-installed
    type: tool_used
    tool: Bash
    input_match: 'claude\s+plugin\s+(install|i|marketplace\s+add)\b'
    min: 0
    max: 0
